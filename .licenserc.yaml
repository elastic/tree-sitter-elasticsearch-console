header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Elasticsearch B.V. and contributors
    content: |
      Copyright Elasticsearch B.V. and contributors
      SPDX-License-Identifier: Apache-2.0
    pattern: |
      SPDX-License-Identifier: Apache-2.0
  paths-ignore:
    # generated by `tree-sitter generate`
    - src
    - '**/*.json'
    - '**/*.md'
    - '**/*.txt'
    - '**/*.in'
    - '**/py.typed'
    - '.gitattributes'
    - '.gitignore'
    - '.editorconfig'
    - LICENSE
    - go.mod
    - Cargo.lock
    - package-lock.json
    - test/corpus
    - target
    - node_modules
    - build
  comment: on-failure
