[package]
name = "tree-sitter-elasticsearch-console"
description = "Elasticsearch developer console grammar for tree-sitter"
version = "0.1.0"
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "elasticsearch-console", "Elasticsearch", "Kibana"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/elastic/tree-sitter-elasticsearch-console"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0.87"

[dev-dependencies]
tree-sitter = "=0.23.2"
